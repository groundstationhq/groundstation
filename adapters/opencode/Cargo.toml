[package]
name = "groundstation-adapter-opencode"
description = "Ground Station adapter for OpenCode v2: plugin installation and event normalization"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock", "std"] }
groundstation-schema = { version = "0.1.0", path = "../../crates/schema" }
serde_json = "1.0.151"
uuid = { version = "1.26.1", features = ["v5"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
uuid = { version = "1.26.1", features = ["v7"] }
