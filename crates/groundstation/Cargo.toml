[package]
name = "groundstation"
description = "Ground Station CLI: connect agents, run the local daemon, inspect trajectories"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock", "std"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
flate2 = "1.1.10"
form_urlencoded = "1.2.2"
groundstation-adapter-claude-code = { workspace = true }
groundstation-adapter-codex = { workspace = true }
groundstation-adapter-opencode = { workspace = true }
groundstation-adapter-pi = { workspace = true }
groundstation-hooks-json = { workspace = true }
groundstation-wire = { workspace = true }
groundstation-schema = { workspace = true }
gsd = { workspace = true }
open = "5.4.4"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["form", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
tar = "0.4.46"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
toml = "1.1.6"
uuid = { version = "1.26.1", features = ["v4", "v7"] }
toml_edit = "0.25.15"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
