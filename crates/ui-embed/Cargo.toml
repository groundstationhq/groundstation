[package]
name = "groundstation-ui-embed"
description = "The built Ground Station UI (ui/dist), embedded and served by gsd and the hosted api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
axum = "0.8.9"
# debug-embed: debug builds embed the UI too, rather than reading it from
# OUT_DIR on each request, so every build serves the bundle it was built with.
rust-embed = { version = "8.12.0", features = ["interpolate-folder-path", "mime-guess", "debug-embed"] }

[dev-dependencies]
http-body-util = "0.1.5"
tokio = { version = "1.53.1", features = ["rt", "macros"] }
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true
