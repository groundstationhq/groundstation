[workspace]
resolver = "3"
members = ["crates/*", "adapters/*"]

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/groundstationhq/groundstation"
homepage = "https://groundstation.sh"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
