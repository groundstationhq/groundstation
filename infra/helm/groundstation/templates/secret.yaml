{{- $signIn := .Values.signIn }}
{{- if and (not $signIn.adminPassword.enabled) (not $signIn.oidc.issuer) }}
{{- fail "no way to sign in: set signIn.adminPassword.enabled or signIn.oidc.issuer" }}
{{- end }}
{{- if ne (empty $signIn.oidc.issuer) (empty $signIn.oidc.clientId) }}
{{- fail "set both signIn.oidc.issuer and signIn.oidc.clientId, or neither" }}
{{- end }}
{{- if and $signIn.adminPassword.value (lt (len $signIn.adminPassword.value) 12) }}
{{- fail "signIn.adminPassword.value must be at least 12 characters" }}
{{- end }}
{{- if not .Values.secrets.existingSecret }}
{{- /*
Each value is the one set in the values, or else the one already in the
cluster, or else a new random one. The databases take their passwords only
when their volumes are new, so a password must never change by itself.
*/}}
{{- $name := include "groundstation.fullname" . }}
{{- $kept := dict }}
{{- with lookup "v1" "Secret" .Release.Namespace $name }}
{{- $kept = .data | default dict }}
{{- end }}
{{- $set := dict
  "admin-password" $signIn.adminPassword.value
  "clickhouse-admin-password" .Values.secrets.clickhouse.admin
  "clickhouse-ingest-password" .Values.secrets.clickhouse.ingest
  "clickhouse-api-password" .Values.secrets.clickhouse.api
  "clickhouse-worker-password" .Values.secrets.clickhouse.worker
  "postgres-owner-password" .Values.secrets.postgres.owner
  "postgres-ingest-password" .Values.secrets.postgres.ingest
  "postgres-worker-password" .Values.secrets.postgres.worker
}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "groundstation.labels" (dict "root" . "component" "secrets") | nindent 4 }}
  annotations:
    # Stays when the release is uninstalled, as the databases' volumes do: a
    # reinstall under the same name finds both and they still match.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $key := keys $set | sortAlpha }}
  {{- $value := get $set $key }}
  {{- if $value }}
  {{ $key }}: {{ $value | toString | b64enc | quote }}
  {{- else if hasKey $kept $key }}
  {{ $key }}: {{ get $kept $key | quote }}
  {{- else }}
  {{ $key }}: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- if $signIn.oidc.issuer }}
  oidc-client-secret: {{ $signIn.oidc.clientSecret | toString | b64enc | quote }}
  {{- end }}
{{- end }}
