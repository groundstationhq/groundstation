name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # The UI is built below; fail rather than test the placeholder page.
      GS_UI_REQUIRED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Build the UI first so the embedded-UI code path is what gets tested.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build the UI
        working-directory: ui
        run: npm ci && npm run build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  # The backend's tests against real ClickHouse, Postgres and Dex, started from
  # the same docker-compose.yml developers use.
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Start the databases
        run: docker compose --profile dev up -d --wait clickhouse postgres dex
      - name: Test against them
        run: >-
          cargo test -p groundstation-backend -p groundstation-ingest
          -p groundstation-api -p groundstation-worker -- --include-ignored
      - name: Check the edge
        run: docker/caddy/test.sh
      - name: Container logs
        if: failure()
        run: docker compose --profile dev logs --no-color

  # The image self-hosters build: it must build, with the UI in it.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build --tag groundstation-server:ci .
