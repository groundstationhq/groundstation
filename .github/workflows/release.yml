name: Release

# Builds both binaries for every supported target and publishes a GitHub Release
# with checksums and the changelog section for that version as the notes. Also
# builds the backend's image and pushes it to the GitHub Container Registry as
# `X.Y.Z`, and as `latest` when that is the newest release.
# Normally started by the "Prepare release" workflow; pushing a `vX.Y.Z` tag by
# hand works too (the tag must match the workspace version).
# install.sh resolves "latest" through the VERSION asset, so no API calls are needed.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # crates/ui-embed's build script embeds the UI in gsd when ui/dist exists.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build the UI
        working-directory: ui
        run: npm ci && npm run build
      - name: Install musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@cross
      - name: Build
        env:
          # The UI was built above: fail rather than ship the placeholder page.
          GS_UI_REQUIRED: 1
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }} -p groundstation -p gsd
          else
            cargo build --release --locked --target ${{ matrix.target }} -p groundstation -p gsd
          fi
      - name: Package
        id: pkg
        run: |
          set -eu
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          ws=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          if [ "$version" != "$ws" ]; then echo "tag $tag does not match workspace version $ws" >&2; exit 1; fi
          name="groundstation-${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/groundstation" "target/${{ matrix.target }}/release/gsd" LICENSE NOTICE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          echo "asset=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: ${{ steps.pkg.outputs.asset }}
          if-no-files-found: error

  # The backend's image (ingest, api and worker in one), for both architectures.
  # Each is built on a runner of its own kind: emulating one takes many times
  # longer. They are pushed as `X.Y.Z-amd64` and `X.Y.Z-arm64`, which the next
  # job joins under `X.Y.Z`.
  image:
    name: image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-latest
          - arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/groundstation-server
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Version
        id: v
        run: |
          set -eu
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          ws=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          if [ "$version" != "$ws" ]; then echo "tag $tag does not match workspace version $ws" >&2; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Sign in to the registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Build and push
        run: |
          set -eu
          version="${{ steps.v.outputs.version }}"
          # The source label is what ties the package to this repository.
          docker build \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" \
            --label "org.opencontainers.image.version=$version" \
            --label "org.opencontainers.image.licenses=Apache-2.0" \
            --label "org.opencontainers.image.description=Ground Station backend: ingest, api and worker" \
            --tag "$IMAGE:$version-${{ matrix.arch }}" .
          docker push "$IMAGE:$version-${{ matrix.arch }}"

  # One name for both architectures: `docker pull` and Kubernetes pick theirs.
  image-manifest:
    name: image
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/groundstation-server
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Sign in to the registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Join the architectures
        run: |
          set -eu
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          names="--tag $IMAGE:$version"
          # `latest` follows the newest release, never a pre-release, and
          # stays where it is when an older tag is built again.
          newest=$(git tag --list 'v*' | grep -v -e '-' | sort -V | tail -n 1)
          if [ "$tag" = "$newest" ]; then names="$names --tag $IMAGE:latest"; fi
          docker buildx imagetools create $names "$IMAGE:$version-amd64" "$IMAGE:$version-arm64"
          docker buildx imagetools inspect "$IMAGE:$version"

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: taiki-e/install-action@git-cliff
      - name: Release notes from the changelog
        run: |
          set -eu
          git cliff --current --strip all | sed '/^## \[/d' > notes.md
          # Fall back to a one-liner if the tag has no grouped commits.
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          cat notes.md
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - name: Checksums and version marker
        run: |
          set -eu
          cd assets
          tag="${{ inputs.tag || github.ref_name }}"
          printf '%s\n' "${tag#v}" > VERSION
          sha256sum *.tar.gz > SHA256SUMS
          ls -la
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            assets/*.tar.gz
            assets/SHA256SUMS
            assets/VERSION
          body_path: notes.md
          generate_release_notes: false
